name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests (Stim intentionally NOT installed)
        # `python -m pytest` keeps the backend working directory on sys.path,
        # matching local execution and the project's top-level backend imports.
        run: python -m pytest -q

  backend-stim:
    name: Backend with optional Stim
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies + optional Stim
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-stim.txt
      - name: Run tests with Stim available
        run: python -m pytest -q

  frontend:
    name: Frontend (unit + build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend interaction + accessibility (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # These suites are intentionally backend-independent: they exercise the
      # editor, pointer/keyboard movement, custom-gate persistence, responsive
      # shells, theme state, and accessibility while FastAPI is unreachable.
      # Platform-specific visual snapshots and backend integration suites remain
      # separate because their prerequisites differ from this Linux smoke job.
      - name: Run editor interaction + accessibility suites
        run: npx playwright test e2e/smoke.spec.ts e2e/movement.spec.ts e2e/custom-gates.spec.ts e2e/operation-ordering.spec.ts e2e/a11y.spec.ts

  connected-e2e:
    name: Connected circuit, state, and hardware workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        run: |
          pip install -r backend/requirements-tested-py312.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
          npm run build
      - name: Run against the real backend
        env:
          REQUIRE_BACKEND: "1"
        run: |
          cd backend
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health
          cd ../frontend
          npx playwright test e2e/backend.spec.ts e2e/hardware.spec.ts e2e/state-analysis.spec.ts e2e/circuit-diagram.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: connected-e2e-failure
          path: |
            frontend/test-results/
            /tmp/backend.log
